<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Examen</title>
  <style>
    :root {
      --rojo-pastel: #cc5c5c;
      --rojo-suave: #a94442;
      --fondo-claro: #f9f9f9;
      --texto-claro: #333;
      --gris-borde: #ddd;
      --gris-input: #f2f2f2;

      --fondo-oscuro: #1e1e1e;
      --gris-oscuro: #2a2a2a;
      --texto-oscuro: #e0e0e0;
      --gris-borde-oscuro: #444;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--fondo-claro);
      color: var(--texto-claro);
      margin: 0;
      padding: 2rem;
      transition: background-color 0.3s, color 0.3s;
    }

    body.dark {
      background-color: var(--fondo-oscuro);
      color: var(--texto-oscuro);
    }

    h2 {
      color: var(--rojo-pastel);
      margin-bottom: 2rem;
      text-align: center;
    }

    form {
      background-color: var(--gris-input);
      padding: 2rem;
      border: 1px solid var(--gris-borde);
      border-radius: 8px;
      max-width: 500px;
      margin: 0 auto;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    body.dark form {
      background-color: var(--gris-oscuro);
      border-color: var(--gris-borde-oscuro);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-size: 1rem;
      font-weight: bold;
      color: var(--texto-claro);
    }

    body.dark .form-group label {
      color: var(--texto-oscuro);
    }

    input, select, textarea {
      width: 100%;
      padding: 0.8rem;
      margin-top: 0.5rem;
      margin-bottom: 1rem;
      border: 1px solid var(--gris-borde);
      border-radius: 5px;
      font-size: 1rem;
      background-color: white;
      color: var(--texto-claro);
    }

    body.dark input,
    body.dark select,
    body.dark textarea {
      background-color: #333;
      color: var(--texto-oscuro);
      border-color: var(--gris-borde-oscuro);
    }

    button {
      background-color: var(--rojo-pastel);
      border: none;
      color: white;
      padding: 0.8rem 1.2rem;
      font-size: 1rem;
      border-radius: 5px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background-color: #b84e4e;
    }

    .top-actions {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .toggle-btn {
      background-color: transparent;
      border: 1px solid var(--rojo-suave);
      padding: 0.3rem 0.8rem;
      border-radius: 5px;
      cursor: pointer;
      color: var(--rojo-suave);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="top-actions">
    <button class="toggle-btn" onclick="toggleDarkMode()">🌙 Modo Nocturno</button>
  </div>

  <h2>Crear Examen</h2>

  <form method="post">
    {% csrf_token %}
    
    <!-- Form Fields -->
    <div class="form-group">
      {{ form.as_p }}
    </div>

    <!-- Submit Button -->
    <button type="submit">Guardar</button>
  </form>

  <script>
    function toggleDarkMode() {
      document.body.classList.toggle('dark');
    }
  </script>
</body>
</html>
