{% extends "base.html" %}

{% block title %}Editar Alumno{% endblock %}
{% block page_title %}Editar Alumno{% endblock %}

{% block content %}
    <div class="content">
        <div class="form-container">
            <form method="post" action="{% url 'editar_alumno' form.instance.pk %}">
                {% csrf_token %}

                {% for field in form %}
                    <div class="form-group">
                        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="error" style="color: #990000; font-size: 14px; margin-top: 5px;">
                                {{ field.errors }}
                            </div>
                        {% endif %}
                    </div>
                {% endfor %}

                <div class="button-group">
                    <div class="button-wrapper">
                        <a href="{% url 'listar_alumnos' %}" class="cancel-btn">
                            <i class="fas fa-times"></i> Cancelar
                        </a>
                    </div>
                    <div class="button-wrapper">
                        <button type="submit" class="submit-btn">
                            <i class="fas fa-check"></i> Guardar Cambios
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
