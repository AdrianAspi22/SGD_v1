{% extends "base.html" %}

{% block title %}Dashboard de Dojo{% endblock %}
{% block page_title %}Dashboard de Dojo{% endblock %}

{% block content %}
<div class="content">
    <h1>{{ message }}</h1>

    {% if dojo %}
    <div class="info-card">
        <h2>{{ dojo.nombre }}</h2>
        <p><i class="fas fa-map-marker-alt"></i> Ubicación: {{ dojo.ubicacion }}</p>
    </div>
    {% endif %}
</div>
{% endblock %}
