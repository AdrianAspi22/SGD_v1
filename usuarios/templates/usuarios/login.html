{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block page_title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="form-container" style="max-width: 400px; margin: auto;">
    {% if messages %}
        <div class="error" style="text-align: center; margin-bottom: 15px;">
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form method="post" novalidate>
        {% csrf_token %}
        <div class="form-group">
            <label for="username">Usuario</label>
            <input type="text" name="username" id="username" class="form-control" required placeholder="admin_dojo">
        </div>

        <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" name="password" id="password" class="form-control" required placeholder="••••••••">
        </div>

        <div class="button-group" style="justify-content: center;">
            <button type="submit" class="submit-btn" style="width: 100%;">
                <i class="fas fa-sign-in-alt"></i> Ingresar
            </button>
        </div>

        <div style="text-align: center; margin-top: 10px;">
            <a href="#" style="color: var(--primary-color); font-size: 0.9rem; text-decoration: underline;">
                ¿Olvidaste tu contraseña?
            </a>
        </div>
    </form>
</div>

{% endblock %}
