<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignar Examen a Alumno</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #8b0000; /* Rojo oscuro - tradición */
            --secondary-color: #222222; /* Negro profundo para el sidebar */
            --accent-color: #e0a800; /* Dorado - prestigio */
            --light-bg: #f5f5f5;
            --white-color: #ffffff;
            --text-color: #333333;
            --hover-color: rgba(139, 0, 0, 0.1);
            --card-shadow: 0 2px 10px rgba(0, 0, 0, 0.05);
            
            /* Dark mode colors */
            --dark-bg: #1e1e1e;
            --dark-card: #2a2a2a;
            --dark-text: #e0e0e0;
            --dark-border: #444;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--light-bg);
            min-height: 100vh;
            transition: background-color 0.3s, color 0.3s;
            color: var(--text-color);
        }
        
        body.dark {
            background-color: var(--dark-bg);
            color: var(--dark-text);
        }
        
        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: var(--secondary-color);
            color: var(--white-color);
            height: 100vh;
            padding: 20px;
            overflow-y: auto;
            transition: all 0.3s ease;
        }
        
        .sidebar h2 {
            color: var(--white-color);
            font-size: 1.5rem;
            padding-bottom: 15px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .sidebar h2 i {
            color: var(--accent-color);
        }
        
        .sidebar a {
            display: flex;
            align-items: center;
            color: var(--white-color);
            text-decoration: none;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 6px;
            transition: all 0.3s;
            font-size: 0.95rem;
        }
        
        .sidebar a i {
            margin-right: 10px;
            width: 20px;
            text-align: center;
        }
        
        .sidebar a:hover {
            background-color: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        
        .sidebar a.active {
            background-color: var(--primary-color);
        }
        
        .sidebar a.new-student {
            margin-top: 20px;
            background-color: var(--accent-color);
            color: var(--secondary-color);
            font-weight: 600;
        }
        
        .sidebar a.new-student:hover {
            background-color: #c09100;
        }
        
        .sidebar a.logout {
            margin-top: 40px;
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .sidebar a.logout:hover {
            background-color: rgba(220, 53, 69, 0.8);
        }
        
        /* Content Area */
        .content {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
        }
        
        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        
        .content-header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            display: inline-block;
        }
        
        .toggle-btn {
            background-color: var(--secondary-color);
            color: var(--white-color);
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s;
        }
        
        .toggle-btn:hover {
            background-color: var(--primary-color);
        }
        
        /* Form Styles */
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--white-color);
            padding: 30px;
            border-radius: 8px;
            box-shadow: var(--card-shadow);
            transition: all 0.3s;
        }
        
        body.dark .form-container {
            background-color: var(--dark-card);
            border-color: var(--dark-border);
        }
        
        .form-container h2 {
            color: var(--primary-color);
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.5rem;
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            display: inline-block;
            width: 100%;
        }
        
        body.dark .form-container h2 {
            color: var(--accent-color);
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-color);
        }
        
        body.dark .form-group label {
            color: var(--accent-color);
        }
        
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            background-color: var(--white-color);
            color: var(--text-color);
            transition: all 0.3s;
        }
        
        body.dark .form-group input,
        body.dark .form-group select,
        body.dark .form-group textarea {
            background-color: var(--dark-bg);
            border-color: var(--dark-border);
            color: var(--dark-text);
        }
        
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(224, 168, 0, 0.2);
        }
        
        .submit-btn {
            background-color: var(--primary-color);
            color: var(--white-color);
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            background-color: #7c0000;
            transform: translateY(-2px);
        }
        
        .cancel-btn {
            background-color: #6c757d;
            color: var(--white-color);
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 10px;
            text-decoration: none;
            text-align: center;
        }
        
        .cancel-btn:hover {
            background-color: #5a6268;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        
        .button-wrapper {
            flex: 1;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            
            .sidebar {
                width: 100%;
                height: auto;
                max-height: 70px;
                overflow: hidden;
                padding: 15px 20px;
                transition: max-height 0.3s ease;
            }
            
            .sidebar.expanded {
                max-height: 100vh;
            }
            
            .sidebar h2 {
                margin-bottom: 0;
                padding-bottom: 0;
                border-bottom: none;
                cursor: pointer;
            }
            
            .sidebar-links {
                margin-top: 15px;
                display: none;
            }
            
            .sidebar.expanded .sidebar-links {
                display: block;
            }
            
            .content {
                padding: 20px 15px;
            }
            
            .content-header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <h2 onclick="toggleSidebar()"><i class="fas fa-karate"></i> <span>Menú</span></h2>
        <div class="sidebar-links">
            <a href="{% url 'crear_alumno' %}" class="new-student">
                <i class="fas fa-user-plus"></i>
                <span>+ Nuevo Alumno</span>
            </a>
            <a href="{% url 'listar_alumnos' %}">
                <i class="fas fa-users"></i>
                <span>Ver Alumnos</span>
            </a>
            <a href="{% url 'listar_examenes' %}" class="active">
                <i class="fas fa-award"></i>
                <span>Exámenes</span>
            </a>
            <a href="{% url 'listar_pagos' %}">
                <i class="fas fa-money-bill-wave"></i>
                <span>Pagos</span>
            </a>
            <a href="{% url 'logout' %}" class="logout">
                <i class="fas fa-sign-out-alt"></i>
                <span>Cerrar sesión</span>
            </a>
        </div>
    </div>
    
    <!-- Content Area -->
    <div class="content">
        <div class="content-header">
            <h1>Editar Examen</h1>
            <button class="toggle-btn" onclick="toggleDarkMode()">
                <i class="fas fa-moon"></i> Modo Oscuro
            </button>
        </div>
        
        <div class="form-container">
            <form method="post">
                {% csrf_token %}
                
                {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                    <small>{{ field.help_text }}</small>
                    {% endif %}
                    {% if field.errors %}
                    <div class="error">
                        {{ field.errors }}
                    </div>
                    {% endif %}
                </div>
                {% endfor %}
                
                <div class="button-group">
                    <div class="button-wrapper">
                        <a href="{% url 'listar_examenes' %}" class="cancel-btn">
                            <i class="fas fa-times"></i> Cancelar
                        </a>
                    </div>
                    <div class="button-wrapper">
                        <button type="submit" class="submit-btn">
                            <i class="fas fa-check"></i> Guardar Cambios
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        function toggleDarkMode() {
            document.body.classList.toggle('dark');
            
            // Update button icon and text
            const button = document.querySelector('.toggle-btn');
            if (document.body.classList.contains('dark')) {
                button.innerHTML = '<i class="fas fa-sun"></i> Modo Claro';
            } else {
                button.innerHTML = '<i class="fas fa-moon"></i> Modo Oscuro';
            }
            
            // Store preference in local storage
            const isDarkMode = document.body.classList.contains('dark');
            localStorage.setItem('darkMode', isDarkMode);
        }
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('expanded');
        }
        
        // Check if dark mode was enabled previously
        document.addEventListener('DOMContentLoaded', function() {
            // Check for dark mode preference
            const darkModeEnabled = localStorage.getItem('darkMode') === 'true';
            if (darkModeEnabled) {
                document.body.classList.add('dark');
                document.querySelector('.toggle-btn').innerHTML = '<i class="fas fa-sun"></i> Modo Claro';
            }
            
            // Mark active menu item
            const currentPath = window.location.pathname;
            const menuLinks = document.querySelectorAll('.sidebar a');
            
            menuLinks.forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });
        });
    </script>
</body>
</html>
