<body>

<h1>Eliminar Instructor</h1>

<p>¿Estás seguro de que deseas eliminar al instructor: <strong>{{ instructor.nombres }} {{ instructor.apellidos }}</strong>?</p>

<form method="post">

    <a href="{% url 'listar_instructores' %}">Cancelar</a>
</form>

</body>
